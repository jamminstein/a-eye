<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>A EYE</title>
<meta name="description" content="nothing to see here">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<link rel="icon" type="image/gif" href="favicon.gif">
<link rel="preload" href="grain.png" as="image">
<link rel="preload" href="fonts/AUTHENTICSans-90.woff2" as="font" type="font/woff2" crossorigin>
<meta property="og:title" content="A EYE">
<meta property="og:description" content="nothing to see here">
<meta property="og:type" content="website">
<meta property="og:image" content="https://jamminstein.github.io/a-eye/poster.jpg">
<meta name="twitter:card" content="summary_large_image">
<style>
  html, body {
    height: 100%;
    margin: 0;
    background: #000;
    overflow: hidden;
    overscroll-behavior: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }

  #stare {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center center;
    background: #000;
    display: block;
  }

  /* On a tall viewport `cover` crops so far horizontally that the eyes fall off
     the sides. The clip lives on black, so `contain` letterboxes invisibly and
     keeps the whole face. Threshold sits above the point where the eyes would
     start touching the edges. */
  @media (max-aspect-ratio: 3/2) {
    #stare { object-fit: contain; }
  }

  /* Film grain is laid over the video rather than baked into it. Encoded in,
     synthetic noise is near-incompressible: at any web-sized bitrate the codec
     spends its budget on the noise and returns macroblocking instead of grain.
     Overlaying keeps both the image and the grain sharp, and costs 70 KB. */
  #grain {
    position: fixed;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background-image: url('grain.png');
    background-repeat: repeat;
    opacity: 0.16;
    mix-blend-mode: overlay;
    pointer-events: none;
    will-change: transform;
    animation: grain-shift 0.7s steps(1) infinite;
  }

  /* Eight discrete offsets read as per-frame grain churn without ever
     interpolating, which is what makes it look photochemical. */
  @keyframes grain-shift {
    0%   { transform: translate3d(0, 0, 0); }
    12.5%{ transform: translate3d(-7%, 4%, 0); }
    25%  { transform: translate3d(5%, -9%, 0); }
    37.5%{ transform: translate3d(-11%, -3%, 0); }
    50%  { transform: translate3d(9%, 6%, 0); }
    62.5%{ transform: translate3d(-4%, 11%, 0); }
    75%  { transform: translate3d(12%, -6%, 0); }
    87.5%{ transform: translate3d(-9%, -11%, 0); }
    100% { transform: translate3d(0, 0, 0); }
  }

  /* The one line of type. It sits low, on the lower lid, clear of the pupil, and
     waits a few seconds before it surfaces: the stare comes first, then the
     question. It is under the grain layer in the stack so it carries the same
     film texture as the picture. */
  @font-face {
    font-family: 'Authentic Sans';
    src: url('fonts/AUTHENTICSans-90.woff2') format('woff2');
    font-weight: normal;
    font-style: normal;
    font-display: swap;
  }

  #ask {
    position: fixed;
    left: 0;
    right: 0;
    bottom: max(9vh, calc(env(safe-area-inset-bottom) + 28px));
    margin: 0;
    padding: 0 24px;
    text-align: center;
    font-family: 'Authentic Sans', 'Helvetica Neue', Arial, sans-serif;
    font-size: clamp(16px, 1.9vw, 28px);
    letter-spacing: 0.06em;
    color: rgba(255, 255, 255, 0.88);
    text-shadow: 0 0 14px rgba(0, 0, 0, 0.75), 0 1px 3px rgba(0, 0, 0, 0.6);
    pointer-events: none;
    -webkit-user-select: none;
    user-select: none;
    animation: ask-in 3.5s ease 6s both;
  }

  @keyframes ask-in {
    from { opacity: 0; }
    to   { opacity: 1; }
  }

  /* Keep the texture, drop the churn. The line is simply there. */
  @media (prefers-reduced-motion: reduce) {
    #grain { animation: none; }
    #ask { animation: none; }
  }

</style>
</head>
<body>
<!-- No src or poster here: the script below picks which eye you get on each visit. -->
<video id="stare"
       autoplay muted loop playsinline
       preload="auto"
       disablepictureinpicture
       tabindex="-1"
       aria-label="An eye, watching you."></video>
<p id="ask">What are you looking at?</p>
<div id="grain" aria-hidden="true"></div>
<script>
(function () {
  var v = document.getElementById('stare');
  var reduce = window.matchMedia
    ? window.matchMedia('(prefers-reduced-motion: reduce)')
    : { matches: false, addEventListener: function () {} };

  // ---- which eye ---------------------------------------------------------
  // The list is rewritten by kling/ingest.py. "classic" is the original
  // eye.mp4; any other id is clips/<id>.mp4 with clips/<id>.jpg as its poster.
  var CLIPS = /*clips*/["classic", "eye-01", "eye-01b", "eye-02", "eye-02b", "eye-05", "eye-05b", "eye-07", "eye-08", "eye-09", "eye-09b", "eye-12", "eye-13", "eye-15", "eye-18", "eye-25", "eye-29", "eye-34", "eye-35", "eye-38", "eye-41", "eye-46", "eye-47", "eye-48", "eye-49", "eye-53", "eye-56", "eye-59", "eye-60"]/*end*/;

  function srcOf(id)    { return id === 'classic' ? 'eye.mp4'    : 'clips/' + id + '.mp4'; }
  function posterOf(id) { return id === 'classic' ? 'poster.jpg' : 'clips/' + id + '.jpg'; }

  // eye-07b is a second take of eye-07: the same face. Treated as one eye when
  // deciding what may follow what.
  function baseOf(id) { return id.replace(/^(eye-\d+)[a-z]$/, '$1'); }

  // Five eyes are easter eggs and are left out of the shuffle: the cat-slit lens
  // (eye-60), the eye whose light swells and drains (eye-01, two takes of one
  // face), the retired clown in greasepaint (eye-53), the luchador in his mask
  // (eye-56) and the woman trying not to laugh (eye-46). The page counts visits
  // in localStorage. The first egg turns up a few
  // refreshes in (the 4th to 6th visit), then one every 15 to 30 visits, so it
  // stays a surprise. Without storage the refreshes cannot be counted, so no egg.
  // ?eye=eye-60 still shows one directly.
  var RARE = ['eye-01', 'eye-01b', 'eye-46', 'eye-53', 'eye-56', 'eye-60'];
  var EGG_FIRST = [4, 6];     // the visit number of the first egg: anywhere in this range
  var EGG_GAP   = [15, 30];   // visits between one egg and the next

  function between(lo, hi) { return lo + Math.floor(Math.random() * (hi - lo + 1)); }

  // A fresh shuffle of the pool in which no face follows itself, including the
  // face of the clip shown just before (prev). It reshuffles until that holds, which
  // takes a handful of tries; patching a clash by swapping can leave one at the end.
  function shuffled(pool, prev) {
    var bag;
    for (var tries = 0; tries < 80; tries++) {
      bag = pool.slice();
      for (var i = bag.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1)), t = bag[i]; bag[i] = bag[j]; bag[j] = t;
      }
      var clash = false, last = prev;
      for (var n = 0; n < bag.length && !clash; n++) {
        if (last && baseOf(bag[n]) === baseOf(last)) clash = true;
        last = bag[n];
      }
      if (!clash) break;
    }
    return bag;
  }

  // A shuffled bag kept in localStorage: every clip is shown once before any
  // comes round again, and no face follows itself. Without storage (private
  // windows) it falls back to a plain random pick. ?eye=eye-07 (or #eye-07)
  // shows one particular clip and leaves the bag, and the visit count, alone.
  function pickEye() {
    var q = /[?&]eye=([\w-]+)/.exec(location.search) || /^#([\w-]+)$/.exec(location.hash);
    if (q && CLIPS.indexOf(q[1]) !== -1) return q[1];
    var st = {};
    try { st = JSON.parse(localStorage.getItem('aeye') || '{}') || {}; } catch (e) {}
    var pool = CLIPS.filter(function (id) { return RARE.indexOf(id) === -1; });
    var eggs = RARE.filter(function (id) { return CLIPS.indexOf(id) !== -1; });
    var visits = (+st.visits || 0) + 1;
    var eggAt = +st.eggAt || between(EGG_FIRST[0], EGG_FIRST[1]);
    var eggSeen = st.eggSeen || [];
    var bag = (st.bag || []).filter(function (id) { return pool.indexOf(id) !== -1; });
    var id;
    if (eggs.length && visits >= eggAt) {
      // An egg: each face once before any comes round again, a random take of it.
      var faces = [];
      eggs.forEach(function (r) { var f = baseOf(r); if (faces.indexOf(f) === -1) faces.push(f); });
      var left = faces.filter(function (f) { return eggSeen.indexOf(f) === -1; });
      if (!left.length) { left = faces; eggSeen = []; }
      var face = left[Math.floor(Math.random() * left.length)];
      var takes = eggs.filter(function (r) { return baseOf(r) === face; });
      id = takes[Math.floor(Math.random() * takes.length)];
      eggSeen.push(face);
      eggAt = visits + between(EGG_GAP[0], EGG_GAP[1]);
    } else {
      if (!bag.length) bag = shuffled(pool, st.last);
      id = bag.shift();
    }
    try {
      localStorage.setItem('aeye', JSON.stringify({ bag: bag, last: id, visits: visits, eggAt: eggAt, eggSeen: eggSeen }));
    } catch (e) {}
    return id;
  }

  var eye = pickEye();
  v.poster = posterOf(eye);
  v.src = srcOf(eye);
  // If the chosen clip will not load, show the original rather than a black page.
  v.addEventListener('error', function () {
    if (eye === 'classic') return;
    eye = 'classic';
    v.poster = posterOf(eye);
    v.src = srcOf(eye);
    start();
  }, { once: true });

  // Runs synchronously, before autoplay has buffered enough to render a frame,
  // so reduced-motion viewers get the still poster and never see motion.
  function halt() {
    try { v.pause(); v.currentTime = 0; v.removeAttribute('autoplay'); } catch (e) {}
  }
  if (reduce.matches) halt();

  var armed = false;
  function armTap() {
    if (armed) return;
    armed = true;
    var go = function () {
      document.removeEventListener('pointerdown', go);
      document.removeEventListener('keydown', go);
      armed = false;
      start();
    };
    document.addEventListener('pointerdown', go, { passive: true });
    document.addEventListener('keydown', go);
  }

  function start() {
    if (reduce.matches) return;
    var p = v.play();
    // Autoplay refusals (iOS Low Power Mode, hardened browsers) leave the
    // poster up; the first tap or key anywhere starts it. No visible control.
    if (p && typeof p.catch === 'function') p.catch(armTap);
  }

  start();

  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) start();
  });

  if (reduce.addEventListener) {
    reduce.addEventListener('change', function () {
      if (reduce.matches) halt(); else start();
    });
  }
})();
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>A-eye</title>
<meta name="description" content="A continuous AI stare.">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<link rel="icon" type="image/gif" href="favicon.gif">
<link rel="preload" href="grain.png" as="image">
<meta property="og:title" content="A-eye">
<meta property="og:description" content="A continuous AI stare.">
<meta property="og:type" content="website">
<meta property="og:image" content="https://jamminstein.github.io/a-eye/poster.jpg">
<meta name="twitter:card" content="summary_large_image">
<style>
  html, body {
    height: 100%;
    margin: 0;
    background: #000;
    overflow: hidden;
    overscroll-behavior: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }

  #stare {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center center;
    background: #000;
    display: block;
  }

  /* On a tall viewport `cover` crops so far horizontally that the eyes fall off
     the sides. The clip lives on black, so `contain` letterboxes invisibly and
     keeps the whole face. Threshold sits above the point where the eyes would
     start touching the edges. */
  @media (max-aspect-ratio: 3/2) {
    #stare { object-fit: contain; }
  }

  /* Film grain is laid over the video rather than baked into it. Encoded in,
     synthetic noise is near-incompressible: at any web-sized bitrate the codec
     spends its budget on the noise and returns macroblocking instead of grain.
     Overlaying keeps both the image and the grain sharp, and costs 70 KB. */
  #grain {
    position: fixed;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background-image: url('grain.png');
    background-repeat: repeat;
    opacity: 0.16;
    mix-blend-mode: overlay;
    pointer-events: none;
    will-change: transform;
    animation: grain-shift 0.7s steps(1) infinite;
  }

  /* Eight discrete offsets read as per-frame grain churn without ever
     interpolating, which is what makes it look photochemical. */
  @keyframes grain-shift {
    0%   { transform: translate3d(0, 0, 0); }
    12.5%{ transform: translate3d(-7%, 4%, 0); }
    25%  { transform: translate3d(5%, -9%, 0); }
    37.5%{ transform: translate3d(-11%, -3%, 0); }
    50%  { transform: translate3d(9%, 6%, 0); }
    62.5%{ transform: translate3d(-4%, 11%, 0); }
    75%  { transform: translate3d(12%, -6%, 0); }
    87.5%{ transform: translate3d(-9%, -11%, 0); }
    100% { transform: translate3d(0, 0, 0); }
  }

  /* Keep the texture, drop the churn. */
  @media (prefers-reduced-motion: reduce) {
    #grain { animation: none; }
  }

</style>
</head>
<body>
<video id="stare"
       autoplay muted loop playsinline
       preload="auto"
       poster="poster.jpg"
       disablepictureinpicture
       tabindex="-1"
       aria-label="Two eyes, watching."
       src="eye.mp4"></video>
<div id="grain" aria-hidden="true"></div>
<script>
(function () {
  var v = document.getElementById('stare');
  var reduce = window.matchMedia
    ? window.matchMedia('(prefers-reduced-motion: reduce)')
    : { matches: false, addEventListener: function () {} };

  // Runs synchronously, before autoplay has buffered enough to render a frame,
  // so reduced-motion viewers get the still poster and never see motion.
  function halt() {
    try { v.pause(); v.currentTime = 0; v.removeAttribute('autoplay'); } catch (e) {}
  }
  if (reduce.matches) halt();

  var armed = false;
  function armTap() {
    if (armed) return;
    armed = true;
    var go = function () {
      document.removeEventListener('pointerdown', go);
      document.removeEventListener('keydown', go);
      armed = false;
      start();
    };
    document.addEventListener('pointerdown', go, { passive: true });
    document.addEventListener('keydown', go);
  }

  function start() {
    if (reduce.matches) return;
    var p = v.play();
    // Autoplay refusals (iOS Low Power Mode, hardened browsers) leave the
    // poster up; the first tap or key anywhere starts it. No visible control.
    if (p && typeof p.catch === 'function') p.catch(armTap);
  }

  start();

  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) start();
  });

  if (reduce.addEventListener) {
    reduce.addEventListener('change', function () {
      if (reduce.matches) halt(); else start();
    });
  }
})();
</script>
</body>
</html>
